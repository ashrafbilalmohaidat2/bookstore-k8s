version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bookstore-net
  
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    networks:
      - bookstore-net
      
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=bookstore
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - bookstore-net

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bookstore-net

volumes:
  mongo_data:

networks:
  bookstore-net:
    driver: bridge